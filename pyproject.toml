[project]
name = "pdf2md"
version = "0.1.0"
description = "PDF dosyalarini LLM dostu Markdown'a ceviren Windows masaustu uygulamasi"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling>=2.55.0",
    "pymupdf>=1.26.0",
    "pyside6>=6.9.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "pillow>=11.0.0",
    "tiktoken>=0.9.0",
]

[project.scripts]
pdf2md = "pdf2md.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md"]

# torch'u CPU-only surumden cek: exe boyutunu ~2 GB kucultur
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
